apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
spec:
  containers:
    - name: nginx
      image: nginx:latest

      volumeMounts:
        - name: my-storage
          mountPath: /usr/share/nginx/html
          # Directory inside the container where the PVC is mounted

  volumes:
    - name: my-storage
      persistentVolumeClaim:
        claimName: local-volume-claim
        # Name of the PVC to attach

