apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-volume 
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  volumeMode: Filesystem
  local: 
    path: /mnt/disk/local1  -> this path must exist in inside the node.
    
  hostPath:
    path: /mnt/data
  
  nodeAffinity: 
    required: 
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubectl describe node <nodeName> pick any lables from here [kubernetes.io/hostname]
          operator: In 
          values:['minikube']




