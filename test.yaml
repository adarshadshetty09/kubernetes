apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-volume-claim 
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 2Gi
  volumeMode: Filesystem