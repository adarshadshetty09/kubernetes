- name: Check if helm exists
  command: helm version
  register: helm_check
  failed_when: false
  changed_when: false

- name: Install required packages for Helm
  package:
    name:
      - curl
      - openssl
      - tar
      - git
    state: present
  when: helm_check.rc != 0

- name: Download Helm install script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0755'
  when: helm_check.rc != 0

- name: Install Helm
  command: /tmp/get_helm.sh
  when: helm_check.rc != 0

# ✅ Wait for Kubernetes API
- name: Wait for Kubernetes API
  command: kubectl get nodes
  register: api_check
  retries: 10
  delay: 6
  until: api_check.rc == 0

# ✅ Clean old/broken repo
- name: Remove existing dashboard repo (if any)
  command: helm repo remove kubernetes-dashboard
  ignore_errors: yes

# ✅ Add repo fresh
- name: Add Kubernetes Dashboard repo
  command: helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/

# ✅ Update repo with retry
- name: Update Helm repo
  command: helm repo update
  register: helm_update
  retries: 3
  delay: 5
  until: helm_update.rc == 0

# ✅ Install Dashboard
- name: Install Kubernetes Dashboard
  command: >
    helm upgrade --install {{ dashboard_release_name }}
    {{ dashboard_chart }}
    --namespace {{ dashboard_namespace }}
    --create-namespace
    --wait
    --timeout 5m

# ✅ Wait for pods to be ready (robust)
- name: Wait for dashboard pods
  shell: kubectl get pods -n {{ dashboard_namespace }} --no-headers
  register: pod_status
  retries: 10
  delay: 10
  until: "'Running' in pod_status.stdout"

# ✅ Check service type
- name: Check service type
  shell: kubectl -n {{ dashboard_namespace }} get svc kubernetes-dashboard-kong-proxy -o jsonpath='{.spec.type}'
  register: svc_type
  failed_when: false

# ✅ Patch service to NodePort safely
- name: Patch dashboard service to NodePort
  command: >
    kubectl -n {{ dashboard_namespace }}
    patch svc kubernetes-dashboard-kong-proxy
    -p '{"spec": {"type": "NodePort"}}'
  when:
    - svc_type.stdout is defined
    - svc_type.stdout != "NodePort"

# ✅ Get NodePort with retry
- name: Get NodePort
  shell: kubectl -n {{ dashboard_namespace }} get svc kubernetes-dashboard-kong-proxy -o jsonpath='{.spec.ports[0].nodePort}'
  register: nodeport
  retries: 5
  delay: 5
  until: nodeport.stdout != ""

# ✅ Create admin user
- name: Apply admin user
  copy:
    dest: /tmp/dashboard-admin.yaml
    content: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: admin-user
        namespace: {{ dashboard_namespace }}
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: admin-user
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
      - kind: ServiceAccount
        name: admin-user
        namespace: {{ dashboard_namespace }}

- name: Apply RBAC
  command: kubectl apply -f /tmp/dashboard-admin.yaml

# ✅ Generate token
- name: Generate dashboard token
  command: kubectl -n {{ dashboard_namespace }} create token admin-user
  register: dashboard_token

# ✅ Output access details
- name: Show Dashboard URL
  debug:
    msg:
      - "Dashboard URL: https://{{ ansible_host }}:{{ nodeport.stdout }}"
      - "Token: {{ dashboard_token.stdout }}"