# Ensure kubeconfig directory exists for ansible user
- name: Create .kube directory for ansible user
  file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: '0755'
  when: inventory_hostname in groups['master']

# Copy kubeconfig to ansible user
- name: Copy kubeconfig for ansible user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ansible/.kube/config
    remote_src: yes
    owner: ansible
    group: ansible
    mode: '0644'
  when: inventory_hostname in groups['master']

# Create kube dir for root (IMPORTANT)
- name: Create .kube directory for root
  file:
    path: /root/.kube
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['master']

# Copy kubeconfig to root user
- name: Setup kubeconfig for root user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['master']