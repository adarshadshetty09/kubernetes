---
# tasks file for argocd

- name: Ensure argocd namespace exists
  command: kubectl get namespace argocd
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ns_check
  ignore_errors: yes
  changed_when: false

- name: Create argocd namespace if not exists
  command: kubectl create namespace argocd
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: ns_check.rc != 0

# 🔥 APPLY CRDs FIRST
- name: Apply ArgoCD Application CRD
  command: kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/crds/application-crd.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ignore_errors: yes

- name: Apply ArgoCD AppProject CRD
  command: kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/crds/appproject-crd.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ignore_errors: yes

- name: Apply ArgoCD ApplicationSet CRD
  command: kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/crds/applicationset-crd.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: crd_set
  ignore_errors: yes

# 🔥 SELF-HEAL CRD ONLY IF FAILED
- name: Delete ApplicationSet CRD if apply failed
  shell: kubectl delete crd applicationsets.argoproj.io
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: crd_set.rc != 0
  ignore_errors: yes

- name: Wait before reapply
  pause:
    seconds: 5
  when: crd_set.rc != 0

- name: Reapply ApplicationSet CRD after cleanup
  command: kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/crds/applicationset-crd.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: crd_set.rc != 0

# ✅ Install ArgoCD
- name: Install ArgoCD
  command: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/install.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

# 🔥 Clean failed pods
- name: Delete failed ArgoCD pods
  shell: kubectl delete pod -n argocd --field-selector=status.phase=Failed
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ignore_errors: yes

# ✅ Wait until ArgoCD fully ready
- name: Wait for ArgoCD pods to be fully ready
  shell: kubectl wait --for=condition=Ready pods --all -n argocd --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

# ✅ Verify ArgoCD service exists
- name: Wait for argocd-server service
  shell: kubectl get svc argocd-server -n argocd
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: svc_check
  retries: 10
  delay: 5
  until: svc_check.rc == 0

# 🔥 Ensure NodePort (IMPORTANT)
- name: Get current service type
  shell: kubectl get svc argocd-server -n argocd -o jsonpath='{.spec.type}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: svc_type

- name: Patch ArgoCD service to NodePort if needed
  command: >
    kubectl patch svc argocd-server -n argocd
    -p '{"spec": {"type": "NodePort"}}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: svc_type.stdout != "NodePort"

# 🔥 Get NodePort dynamically
- name: Get ArgoCD NodePort (HTTPS)
  shell: kubectl get svc argocd-server -n argocd -o jsonpath='{.spec.ports[?(@.port==443)].nodePort}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_nodeport

# 🔑 Get password
- name: Get ArgoCD admin password
  shell: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_password

# 🚀 FINAL OUTPUT
- name: Show ArgoCD access details
  debug:
    msg:
      - "ArgoCD URL: https://{{ ansible_host }}:{{ argocd_nodeport.stdout }}"
      - "Username: admin"
      - "Password: {{ argocd_password.stdout }}"