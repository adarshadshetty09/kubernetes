---
# tasks file for argocd

- name: Ensure argocd namespace exists
  command: kubectl get namespace argocd
  register: ns_check
  ignore_errors: yes
  changed_when: false

- name: Create argocd namespace if not exists
  command: kubectl create namespace argocd
  when: ns_check.rc != 0

# 🔥 Clean old problematic CRD
- name: Delete applicationset CRD if exists
  shell: kubectl delete crd applicationsets.argoproj.io --ignore-not-found
  ignore_errors: yes

- name: Wait before reinstall CRD
  pause:
    seconds: 5

# 🔥 APPLY STABLE CRDs (VERSION PINNED - FIXED)
- name: Apply ArgoCD Application CRD
  command: kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/crds/application-crd.yaml
  register: crd_app
  retries: 3
  delay: 5
  until: crd_app.rc == 0

- name: Apply ArgoCD AppProject CRD
  command: kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/crds/appproject-crd.yaml
  register: crd_proj
  retries: 3
  delay: 5
  until: crd_proj.rc == 0

- name: Apply ArgoCD ApplicationSet CRD (FIXED SIZE)
  command: kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/crds/applicationset-crd.yaml
  register: crd_set
  retries: 3
  delay: 5
  until: crd_set.rc == 0

# ✅ Install ArgoCD (MATCH VERSION)
- name: Install ArgoCD
  command: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.3/manifests/install.yaml

# ✅ Wait for ArgoCD pods
- name: Wait for ArgoCD pods to be ready
  shell: kubectl get pods -n argocd --no-headers
  register: pod_status
  until: >
    pod_status.stdout_lines | select('search', 'Running') | list | length >= 6
  retries: 20
  delay: 10

- name: Show ArgoCD pod status
  debug:
    var: pod_status.stdout