---
# tasks file for argocd

- name: Ensure argocd namespace exists
  command: kubectl get namespace argocd
  register: ns_check
  ignore_errors: yes
  changed_when: false

- name: Create argocd namespace if not exists
  command: kubectl create namespace argocd
  when: ns_check.rc != 0

# 🔥 Force delete problematic CRD
- name: Delete applicationset CRD if exists
  shell: kubectl delete crd applicationsets.argoproj.io --ignore-not-found
  ignore_errors: yes

# 🔥 Wait for cleanup
- name: Wait before reinstall CRD
  pause:
    seconds: 5

# 🔥 Apply CRDs with retry (IMPORTANT)
- name: Apply ArgoCD CRDs
  shell: kubectl apply -k https://github.com/argoproj/argo-cd/manifests/crds
  register: crd_apply
  retries: 3
  delay: 10
  until: crd_apply.rc == 0
  ignore_errors: yes

# ✅ Install ArgoCD
- name: Install ArgoCD
  command: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

# ✅ Wait for pods
- name: Wait for ArgoCD pods to be ready
  shell: kubectl get pods -n argocd --no-headers
  register: pod_status
  until: >
    pod_status.stdout_lines | select('search', 'Running') | list | length >= 6
  retries: 20
  delay: 10

- name: Show ArgoCD pod status
  debug:
    var: pod_status.stdout