- name: Deploy Application
  hosts: master
  become: yes

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    PATH: "/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin"

  tasks:

    - name: Copy myapp manifest
      copy:
        src: ../argocd/project01.yaml
        dest: /tmp/project01.yaml

    - name: Apply myapp
      command: kubectl apply -f /tmp/project01.yaml
