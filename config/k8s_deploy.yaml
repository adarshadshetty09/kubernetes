- name: Deploy Application
  hosts: master
  become: yes

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
    PATH: "/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin"

  tasks:

    - name: Copy myapp manifest
      copy:
        src: ../argocd/myapp.yaml
        dest: /tmp/myapp.yaml

    - name: Apply myapp
      command: kubectl apply -f /tmp/myapp.yaml

    - name: Copy test app manifest
      copy:
        src: ../argocd/test.yaml
        dest: /tmp/test.yaml

    - name: Apply test app
      command: kubectl apply -f /tmp/test.yaml